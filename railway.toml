[build]
builder = "RAILPACK"

[deploy]
startCommand = "mkdir -p storage/framework/views storage/framework/sessions storage/framework/cache/data storage/logs bootstrap/cache database && chmod -R 777 storage bootstrap/cache database && touch database/database.sqlite && php artisan migrate --force && (php artisan db:seed --force || true) && (php artisan storage:link || true) && php artisan serve --host=0.0.0.0 --port=$PORT"
